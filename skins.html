
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Галерея — Winter de Mirage</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(140deg, #e5f7ff, #a9dcf7, #83c6ed);
    color: #12334d;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    padding: 22px 6%;
    background: rgba(225,246,255,.9);
    border-bottom: 1px solid #8bcdf0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #167db5;
    font-size: 22px;
    font-weight: bold;
}

.back {
    color: #167db5;
    text-decoration: none;
    font-weight: bold;
}

main {
    max-width: 1250px;
    margin: auto;
    padding: 35px 20px;
}

h1 {
    text-align: center;
    color: #126b9f;
    font-size: 34px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #477b9b;
    margin-bottom: 30px;
}

.panel {
    background: rgba(239,250,255,.85);
    border: 1px solid #91cfee;
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 22px;
    box-shadow: 0 8px 25px rgba(40,120,165,.12);
}

h2 {
    color: #167db5;
    margin-bottom: 17px;
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

button {
    border: 1px solid #8bc9e9;
    background: #e2f5ff;
    color: #236487;
    border-radius: 8px;
    padding: 12px 19px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    background: #c4eaff;
    transform: translateY(-2px);
}

button.active {
    background: #279bd5;
    color: white;
}

.search {
    width: 100%;
    padding: 14px;
    border: 1px solid #91cfee;
    border-radius: 9px;
    background: #f4fbff;
    color: #12334d;
    font-size: 16px;
    outline: none;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
}

.item {
    background: #e5f6ff;
    border: 1px solid #a4d8f1;
    border-radius: 13px;
    padding: 12px;
    text-align: center;
    transition: .2s;
}

.item:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px #83c6ed;
}

.item.selected {
    border: 2px solid #168dcc;
    box-shadow: 0 0 15px #8bd5ff;
}

.item img {
    width: 100%;
    height: 165px;
    object-fit: cover;
    border-radius: 9px;
    margin-bottom: 12px;
}

.item h3 {
    color: #176e9e;
    margin-bottom: 12px;
}

.item button {
    width: 100%;
}

.info {
    color: #477b9b;
    line-height: 1.8;
}

.cancel {
    margin-top: 12px;
    background: #fff0f0;
    border-color: #e8aaaa;
    color: #a74747;
}

@media(max-width:600px) {
    h1 { font-size: 26px; }
    header { padding: 18px; }
}
</style>
</head>

<body>

<header>
    <div class="logo">❄ WINTER DE MIRAGE</div>
    <a class="back" href="index.html">← На главную</a>
</header>

<main>

<h1>ГАЛЕРЕЯ ПРЕДМЕТОВ</h1>
<p class="subtitle">Выбирай понравившиеся предметы</p>

<section class="panel">
    <h2>Категории</h2>
    <div class="buttons" id="categories"></div>
</section>

<section class="panel">
    <h2>Поиск</h2>
    <input class="search" id="search"
           placeholder="Введи название предмета..."
           oninput="renderGallery()">
</section>

<section class="panel">
    <h2 id="galleryTitle">Предметы</h2>
    <div class="gallery" id="gallery"></div>
</section>

<section class="panel">
    <h2>Твой выбор</h2>
    <p class="info" id="selection">Пока ничего не выбрано.</p>
    <button class="cancel" onclick="clearSelection()">
        Отменить выбор
    </button>
</section>

</main>

<script>
const categories = {
    "Персонажи": [
        {
            name: "Ледяной путешественник",
            image: "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=700"
        },
        {
            name: "Зимний исследователь",
            image: "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=700"
        }
    ],

    "Питомцы": [
        {
            name: "Снежный мир",
            image: "https://images.unsplash.com/photo-1483664852095-d6cc6870702d?w=700"
        },
        {
            name: "Ледяной лес",
            image: "https://images.unsplash.com/photo-1448375240586-882707db888b?w=700"
        }
    ],

    "Аксессуары": [
        {
            name: "Голубой кристалл",
            image: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=700"
        },
        {
            name: "Зимнее сияние",
            image: "https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=700"
        }
    ],

    "Артефакты": [
        {
            name: "Северное сияние",
            image: "https://images.unsplash.com/photo-1483347756197-71ef80e95f73?w=700"
        },
        {
            name: "Горная вершина",
            image: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=700"
        }
    ]
};

let currentCategory = "Персонажи";
let selectedItem = null;

function renderCategories() {
    const container = document.getElementById("categories");
    container.innerHTML = "";

    Object.keys(categories).forEach(category => {
        const button = document.createElement("button");
        button.textContent = category;
        button.classList.toggle("active", category === currentCategory);

        button.onclick = () => {
            currentCategory = category;
            renderCategories();
            renderGallery();
        };

        container.appendChild(button);
    });
}

function renderGallery() {
    const gallery = document.getElementById("gallery");
    const search = document.getElementById("search").value.toLowerCase();

    gallery.innerHTML = "";
    document.getElementById("galleryTitle").textContent = currentCategory;

    const items = categories[currentCategory].filter(item =>
        item.name.toLowerCase().includes(search)
    );

    if (items.length === 0) {
        gallery.textContent = "Ничего не найдено.";
        return;
    }

    items.forEach(item => {
        const card = document.createElement("div");
        card.className = "item";

        if (selectedItem === item.name) {
            card.classList.add("selected");
        }

        card.innerHTML = `
            <img src="${item.image}" alt="${item.name}">
            <h3>${item.name}</h3>
            <button>${selectedItem === item.name ? "Выбрано" : "Выбрать"}</button>
        `;

        card.querySelector("button").onclick = () => {
            selectedItem = item.name;
            renderGallery();
            renderSelection();
        };

        gallery.appendChild(card);
    });
}

function renderSelection() {
    document.getElementById("selection").textContent =
        selectedItem ? "Выбрано: " + selectedItem : "Пока ничего не выбрано.";
}

function clearSelection() {
    selectedItem = null;
    renderGallery();
    renderSelection();
}

renderCategories();
renderGallery();
renderSelection();
</script>

</body>
</html>
