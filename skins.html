
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winter de Mirage — Скины</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #070d18;
    color: #eaf4ff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

.header {
    min-height: 75px;
    padding: 15px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    background: #101d30;
    border-bottom: 1px solid #39bdf5;
    box-shadow: 0 3px 18px #168ac033;
}

.logo {
    color: #9de4ff;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 1px;
}

.header a {
    color: white;
    text-decoration: none;
    padding: 11px 19px;
    border: 1px solid #3c9ecb;
    border-radius: 8px;
    transition: .2s;
}

.header a:hover {
    background: #168ac0;
}

.container {
    width: 90%;
    max-width: 1150px;
    margin: 40px auto;
}

h1 {
    text-align: center;
    font-size: 32px;
    color: #a9e8ff;
    margin-bottom: 12px;
    text-shadow: 0 0 18px #36bfff66;
}

.subtitle {
    text-align: center;
    color: #a9bfd0;
    margin-bottom: 35px;
}

h2 {
    text-align: center;
    font-size: 23px;
    margin: 28px 0;
    color: #dff6ff;
}

.team-grid,
.category-grid,
.items-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px;
}

.category-grid,
.items-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
}

.card {
    background: linear-gradient(145deg, #12263b, #0b192a);
    border: 1px solid #285c7d;
    border-radius: 13px;
    overflow: hidden;
    cursor: pointer;
    transition: .25s;
    text-align: center;
}

.card:hover {
    transform: translateY(-4px);
    border-color: #76d8ff;
    box-shadow: 0 0 20px #24a9e544;
}

.card.selected {
    border: 2px solid #7cddff;
    box-shadow: 0 0 18px #35bfff66;
}

.card img {
    display: block;
    width: 100%;
    height: 210px;
    object-fit: cover;
}

.card h3 {
    color: white;
    font-size: 19px;
    padding: 18px 10px;
}

.team-card img {
    height: 270px;
}

.team-card h3 {
    font-size: 23px;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

.button-row {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 13px;
    margin: 25px 0;
}

button {
    color: white;
    background: linear-gradient(135deg, #168ac0, #14618e);
    border: 1px solid #5bcaff;
    border-radius: 8px;
    padding: 13px 24px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    background: linear-gradient(135deg, #27b5ed, #168ac0);
    box-shadow: 0 0 15px #36bfff55;
}

button.secondary {
    background: #172d40;
    border-color: #476b82;
}

button.secondary:hover {
    background: #294b63;
}

.selection-box {
    max-width: 700px;
    margin: 35px auto;
    padding: 22px;
    text-align: center;
    background: #101f31;
    border: 1px solid #285c7d;
    border-radius: 12px;
    line-height: 2;
}

.selection-box h3 {
    color: #8edfff;
    margin-bottom: 10px;
}

.selection-box span {
    color: #a9e8ff;
}

.empty {
    color: #8299ad !important;
}

@media(max-width: 750px) {
    .category-grid,
    .items-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media(max-width: 500px) {
    .team-grid,
    .category-grid,
    .items-grid {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 25px;
    }

    .card img {
        height: 220px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">WINTER DE MIRAGE</div>
    <a href="index.html">← На главную</a>
</header>

<main class="container">

    <h1>МАСТЕРСКАЯ</h1>
    <p class="subtitle">Выбери сторону и настрой свой внешний вид</p>

    <!-- ВЫБОР СТОРОНЫ -->
    <section id="teamScreen">
        <h2>Выбери сторону</h2>

        <div class="team-grid">

            <div class="card team-card" onclick="chooseTeam('T')">
                <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=900" alt="Зимняя атмосфера">
                <h3>T — Террористы</h3>
            </div>

            <div class="card team-card" onclick="chooseTeam('CT')">
                <img src="https://images.unsplash.com/photo-1511497584788-876760111969?w=900" alt="Лес">
                <h3>CT — Спецназ</h3>
            </div>

        </div>
    </section>

    <!-- ВЫБОР КАТЕГОРИИ -->
    <section id="categoryScreen" class="section">

        <h2 id="teamTitle"></h2>

        <div class="button-row">
            <button class="secondary" onclick="backToTeams()">Сменить сторону</button>
        </div>

        <h2>Выбери категорию</h2>

        <div class="category-grid">

            <div class="card" onclick="openCategory('characters')">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=800" alt="Персонажи">
                <h3>Персонажи</h3>
            </div>

            <div class="card" onclick="openCategory('skins')">
                <img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=800" alt="Скины">
                <h3>Скины</h3>
            </div>

            <div class="card" onclick="openCategory('knives')">
                <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800" alt="Ножи">
                <h3>Ножи</h3>
            </div>

        </div>

        <div class="selection-box" id="summary"></div>
    </section>

    <!-- ВЫБОР ПРЕДМЕТА -->
    <section id="itemsScreen" class="section">

        <h2 id="itemsTitle"></h2>

        <div class="items-grid" id="itemsGrid"></div>

        <div class="button-row">
            <button class="secondary" onclick="cancelSelection()">Отменить выбор</button>
            <button onclick="backToCategories()">Назад</button>
        </div>

    </section>

</main>

<script>
let currentTeam = "T";
let currentCategory = "";

const selections = {
    T: {
        characters: null,
        skins: null,
        knives: null
    },
    CT: {
        characters: null,
        skins: null,
        knives: null
    }
};

const categoryNames = {
    characters: "Персонажи",
    skins: "Скины",
    knives: "Ножи"
};

const catalog = {
    characters: [
        {
            name: "Персонаж 1",
            image: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=800"
        },
        {
            name: "Персонаж 2",
            image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800"
        },
        {
            name: "Персонаж 3",
            image: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=800"
        }
    ],

    skins: [
        {
            name: "Образ 1",
            image: "https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=800"
        },
        {
            name: "Образ 2",
            image: "https://images.unsplash.com/photo-1483985988355-763728e1935b?w=800"
        },
        {
            name: "Образ 3",
            image: "https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=800"
        }
    ],

    knives: [
        {
            name: "Коллекционный предмет 1",
            image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800"
        },
        {
            name: "Коллекционный предмет 2",
            image: "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=800"
        },
        {
            name: "Коллекционный предмет 3",
            image: "https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?w=800"
        }
    ]
};

function chooseTeam(team) {
    currentTeam = team;

    document.getElementById("teamScreen").style.display = "none";
    document.getElementById("categoryScreen").classList.add("active");
    document.getElementById("itemsScreen").classList.remove("active");

    document.getElementById("teamTitle").textContent =
        team === "T" ? "СТОРОНА T — ТЕРРОРИСТЫ" : "СТОРОНА CT — СПЕЦНАЗ";

    updateSummary();
}

function backToTeams() {
    document.getElementById("teamScreen").style.display = "block";
    document.getElementById("categoryScreen").classList.remove("active");
    document.getElementById("itemsScreen").classList.remove("active");
}

function openCategory(category) {
    currentCategory = category;

    document.getElementById("categoryScreen").classList.remove("active");
    document.getElementById("itemsScreen").classList.add("active");

    document.getElementById("itemsTitle").textContent =
        categoryNames[category] + " — " + currentTeam;

    const grid = document.getElementById("itemsGrid");
    grid.innerHTML = "";

    catalog[category].forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "card";

        if (selections[currentTeam][category] === index) {
            card.classList.add("selected");
        }

        const img = document.createElement("img");
        img.src = item.image;
        img.alt = item.name;
        img.loading = "lazy";

        const heading = document.createElement("h3");
        heading.textContent = item.name;

        card.appendChild(img);
        card.appendChild(heading);

        card.onclick = () => selectItem(index);

        grid.appendChild(card);
    });
}

function selectItem(index) {
    selections[currentTeam][currentCategory] = index;
    openCategory(currentCategory);
    updateSummary();
}

function cancelSelection() {
    selections[currentTeam][currentCategory] = null;
    openCategory(currentCategory);
    updateSummary();
}

function backToCategories() {
    document.getElementById("itemsScreen").classList.remove("active");
    document.getElementById("categoryScreen").classList.add("active");
    updateSummary();
}

function getName(category, index) {
    if (index === null) {
        return '<span class="empty">Не выбрано</span>';
    }

    return "<span>" + catalog[category][index].name + "</span>";
}

function updateSummary() {
    const data = selections[currentTeam];

    document.getElementById("summary").innerHTML = `
        <h3>Твой выбор — сторона ${currentTeam}</h3>
        Персонаж: ${getName("characters", data.characters)}<br>
        Скин: ${getName("skins", data.skins)}<br>
        Нож: ${getName("knives", data.knives)}
    `;
}
</script>

</body>
</html>
