
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winter de Mirage — Галерея</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #071522;
    color: #eaf8ff;
    min-height: 100vh;
}

header {
    padding: 22px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #102b40;
    border-bottom: 1px solid #43b9e9;
}

.logo {
    color: #72d5ff;
    font-size: 23px;
    font-weight: bold;
}

header a {
    color: #bdeaff;
    text-decoration: none;
}

main {
    width: 90%;
    max-width: 1150px;
    margin: 35px auto;
}

h1 {
    text-align: center;
    color: #83dcff;
    margin-bottom: 30px;
}

h2 {
    color: #83dcff;
    margin: 28px 0 17px;
}

.teams, .categories {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.categories {
    grid-template-columns: repeat(3, 1fr);
}

.card {
    background: #102b40;
    border: 1px solid #285b78;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: .2s;
}

.card:hover {
    border-color: #72d5ff;
    transform: translateY(-3px);
}

.card.selected {
    border: 2px solid #65d5ff;
    box-shadow: 0 0 15px #269acb55;
}

.card img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    display: block;
}

.card h3 {
    text-align: center;
    padding: 16px 8px;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

button {
    background: #168ac0;
    color: white;
    border: none;
    border-radius: 9px;
    padding: 12px 20px;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background: #27a9e5;
}

.cancel {
    background: #344d5d;
}

.cancel:hover {
    background: #496a80;
}

.topline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
}

.selection {
    background: #102b40;
    border: 1px solid #285b78;
    padding: 18px;
    border-radius: 12px;
    margin-top: 28px;
    line-height: 1.9;
}

.item-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.item-grid .card img {
    height: 180px;
}

.back {
    margin-top: 20px;
}

@media(max-width: 700px) {
    .categories, .item-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 450px) {
    .teams, .categories, .item-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">WINTER DE MIRAGE</div>
    <a href="index.html">← На главную</a>
</header>

<main>
    <h1>МАСТЕРСКАЯ ВЫБОРА</h1>

    <div id="teamScreen">
        <h2>1. Выбери сторону</h2>
        <div class="teams">
            <div class="card" onclick="chooseTeam('T')">
                <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=700" alt="T">
                <h3>T — Террористы</h3>
            </div>

            <div class="card" onclick="chooseTeam('CT')">
                <img src="https://images.unsplash.com/photo-1511497584788-876760111969?w=700" alt="CT">
                <h3>CT — Спецназ</h3>
            </div>
        </div>
    </div>

    <div id="categoryScreen" class="section">
        <div class="topline">
            <h2 id="teamTitle">Сторона</h2>
            <button class="cancel" onclick="backToTeams()">Сменить сторону</button>
        </div>

        <h2>2. Выбери раздел</h2>

        <div class="categories">
            <div class="card" onclick="openCategory('characters')">
                <img src="https://images.unsplash.com/photo-1535223289827-42f1e9919769?w=700" alt="">
                <h3>Персонажи</h3>
            </div>

            <div class="card" onclick="openCategory('accessories')">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=700" alt="">
                <h3>Аксессуары</h3>
            </div>

            <div class="card" onclick="openCategory('artifacts')">
                <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=700" alt="">
                <h3>Артефакты</h3>
            </div>
        </div>

        <div class="selection" id="summary"></div>
    </div>

    <div id="itemsScreen" class="section">
        <div class="topline">
            <h2 id="itemsTitle">Предметы</h2>
            <button class="cancel" onclick="backToCategories()">Назад</button>
        </div>

        <div class="item-grid" id="itemsGrid"></div>
        <button class="cancel back" onclick="cancelSelection()">Отменить выбор</button>
    </div>
</main>

<script>
let currentTeam = "T";
let currentCategory = "";

const selections = {
    T: {
        characters: null,
        accessories: null,
        artifacts: null
    },
    CT: {
        characters: null,
        accessories: null,
        artifacts: null
    }
};

const catalog = {
    characters: [
        {
            name: "Персонаж 1",
            image: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=700"
        },
        {
            name: "Персонаж 2",
            image: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=700"
        },
        {
            name: "Персонаж 3",
            image: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=700"
        }
    ],
    accessories: [
        {
            name: "Аксессуар 1",
            image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=700"
        },
        {
            name: "Аксессуар 2",
            image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=700"
        },
        {
            name: "Аксессуар 3",
            image: "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=700"
        }
    ],
    artifacts: [
        {
            name: "Артефакт 1",
            image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=700"
        },
        {
            name: "Артефакт 2",
            image: "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=700"
        },
        {
            name: "Артефакт 3",
            image: "https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?w=700"
        }
    ]
};

const categoryNames = {
    characters: "Персонажи",
    accessories: "Аксессуары",
    artifacts: "Артефакты"
};

function chooseTeam(team) {
    currentTeam = team;
    document.getElementById("teamScreen").style.display = "none";
    document.getElementById("categoryScreen").classList.add("active");
    document.getElementById("teamTitle").textContent =
        team === "T" ? "Сторона T — Террористы" : "Сторона CT — Спецназ";
    updateSummary();
}

function backToTeams() {
    document.getElementById("teamScreen").style.display = "block";
    document.getElementById("categoryScreen").classList.remove("active");
    document.getElementById("itemsScreen").classList.remove("active");
}

function openCategory(category) {
    currentCategory = category;

    document.getElementById("categoryScreen").classList.remove("active");
    document.getElementById("itemsScreen").classList.add("active");

    document.getElementById("itemsTitle").textContent =
        categoryNames[category] + " — " + currentTeam;

    const grid = document.getElementById("itemsGrid");
    grid.innerHTML = "";

    catalog[category].forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "card";

        if (selections[currentTeam][category] === index) {
            card.classList.add("selected");
        }

        const img = document.createElement("img");
        img.src = item.image;
        img.alt = item.name;

        const heading = document.createElement("h3");
        heading.textContent = item.name;

        card.appendChild(img);
        card.appendChild(heading);
        card.onclick = () => selectItem(index);

        grid.appendChild(card);
    });
}

function selectItem(index) {
    selections[currentTeam][currentCategory] = index;
    openCategory(currentCategory);
    updateSummary();
}

function cancelSelection() {
    selections[currentTeam][currentCategory] = null;
    openCategory(currentCategory);
    updateSummary();
}

function backToCategories() {
    document.getElementById("itemsScreen").classList.remove("active");
    document.getElementById("categoryScreen").classList.add("active");
    updateSummary();
}

function updateSummary() {
    const data = selections[currentTeam];

    document.getElementById("summary").innerHTML = `
        <strong>Выбор стороны ${currentTeam}</strong><br>
        Персонаж: ${getName("characters", data.characters)}<br>
        Аксессуар: ${getName("accessories", data.accessories)}<br>
        Артефакт: ${getName("artifacts", data.artifacts)}
    `;
}

function getName(category, index) {
    return index === null ? "Не выбрано" : catalog[category][index].name;
}
</script>

</body>
</html>
